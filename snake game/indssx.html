<!-- index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Snake Game</title>
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#111; color:#eee; font-family:Arial, sans-serif; }
    #game { background:#000; border: 4px solid #222; }
    .info { position: absolute; top: 12px; left: 12px; color:#fff; }
    button { 
        height: 60px;
        width: 120px; 
        margin-left:150px;
        background: green;
        color: white;
        border: none;
        font-size: 20px;
        cursor: pointer;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        margin-top: 600px ;}
  </style>
</head>
<body>
  <div class="info">
    Score: <span id="score">0</span>
    <button id="restart">Restart</button>
  </div>
  <canvas id="game" width="480" height="480"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restart');

    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    let snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
    snake.push({x: snake[0].x - 1, y: snake[0].y});
    let dir = {x:1, y:0};
    let food = null;
    let score = 0;
    let speed = 150; // ms
    let timer;

    function placeFood() {
      while (true) {
        const f = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
        if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; break; }
      }
    }

    function drawCell(x,y,color) {
      ctx.fillStyle = color;
      ctx.fillRect(x*CELL, y*CELL, CELL-1, CELL-1);
    }

    function reset() {
      snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
      snake.push({x: snake[0].x - 1, y: snake[0].y});
      dir = {x:1, y:0};
      score = 0;
      speed = 120;
      placeFood();
      scoreEl.textContent = score;
      clearInterval(timer);
      timer = setInterval(tick, speed);
    }

    function gameOver() {
      clearInterval(timer);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px Arial';
      ctx.fillText('Game Over! Press Restart', 80, canvas.height/2);
    }

    function tick() {
      const head = {...snake[0]};
      head.x += dir.x; head.y += dir.y;

      // wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver(); return;
      }
      // self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

      snake.unshift(head);
      if (food && head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score % 5 === 0 && speed > 40) { speed -= 10; clearInterval(timer); timer = setInterval(tick, speed); }
        placeFood();
      } else {
        snake.pop();
      }

      // draw
      ctx.fillStyle = '#000';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for (let i=0;i<snake.length;i++){
        drawCell(snake[i].x, snake[i].y, i===0 ? '#0f0' : '#0a0');
      }
      if (food) drawCell(food.x, food.y, '#f00');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w') { if (dir.y!==1) dir = {x:0,y:-1}; }
      if (e.key === 'ArrowDown' || e.key === 's') { if (dir.y!==-1) dir = {x:0,y:1}; }
      if (e.key === 'ArrowLeft' || e.key === 'a') { if (dir.x!==1) dir = {x:-1,y:0}; }
      if (e.key === 'ArrowRight' || e.key === 'd') { if (dir.x!==-1) dir = {x:1,y:0}; }
    });

    restartBtn.addEventListener('click', reset);

    // start
    placeFood();
    timer = setInterval(tick, speed);
  </script>
</body>
</html>
